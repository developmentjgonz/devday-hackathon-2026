name: Build and deploy to Cloudflare

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app and check TypeScript
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Check Worker bundle
        run: npx --yes wrangler@4.158.0 deploy --dry-run

      - name: Deploy release to Cloudflare
        if: github.ref == 'refs/heads/release' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.158.0 deploy

      - name: Check production app and database connection
        if: github.ref == 'refs/heads/release' && github.event_name != 'pull_request'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            https://devday-js-2026.deal-finder.workers.dev/ --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            https://devday-js-2026.deal-finder.workers.dev/api/health \
            | node --input-type=module -e 'import assert from "node:assert/strict"; let body = ""; for await (const chunk of process.stdin) body += chunk; assert.deepEqual(JSON.parse(body), { ok: true, service: "devday-js-2026", database: "connected" });'
